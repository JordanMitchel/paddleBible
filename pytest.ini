[pytest]
# Make pytest aware of service source directories
pythonpath =
    .
    backend-services/domain/src
    backend-services/bff/src
    backend-services/ml_service/src
    backend-services/shared/src

# Default test discovery path
testpaths =
    services

# Asyncio config
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Custom markers
markers =
    asyncio: mark a test as using asyncio
    requires_decouple: marks test as one that requires python-decouple which isn't available in pylint (deselect with '-m "not requires_decouple"')
