[project]
name = "paddlebible"
version = "0.1.0"
description = "Paddle Backend Services, ML, BFF and Logging"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "sqlalchemy",
    "spacy>=3.8.11",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "pytest>=9.0.2",
    "kombu>=5.6.2",
    "pika>=1.3.2",
    "celery>=5.6.2",
    "prometheus-client>=0.24.1",
    "loguru>=0.7.3",
    "asyncio>=4.0.0",
    "httpx>=0.28.1",
    "prometheus-fastapi-instrumentator",
    "geopy"
]
